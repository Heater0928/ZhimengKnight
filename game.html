<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>織夢 - 遊戲</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js" defer></script>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

    <!-- 全螢幕背景圖 -->
    <img id="game-background" src="images/backgrounds/start_game.png" alt="遊戲背景">

    <!-- 返回主頁按鈕 -->
    <img id="back-btn" 
        src="images/buttons/NPC_Nikaido_Hiro.png" 
        alt="返回主頁">
        
    <!-- 對話系統 -->
    <div id="dialogue-system" style="display: none;">
        
        <div style="display:flex; width:100%; height:100%;">

            <!-- 左側：角色立繪 -->
            <div style="flex: 1; display:flex; align-items:center; justify-content:center; padding:40px 20px;">
                <img id="dialogue-character" src="" alt="角色立繪" style="max-height:85vh; max-width:100%;">
            </div>

            <!-- 右側：選項 + 對話框 -->
                <div id="dialogue-right">
                    <!-- 對話選項 -->
                    <div id="dialogue-options"></div>
                    
                <!-- 對話框 -->
                <div id="dialogue-box">
                    <div id="dialogue-text"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
