<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>織夢 - 主頁</title>
    <script src="script.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html { height:100%; font-family:"Microsoft JhengHei",sans-serif; color:white; overflow:hidden; }

        /* 背景 */
        #background {
            position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-2;
        }

        /* 遮罩（調淡一點） */
        .overlay {
            position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.35); z-index:-1;
        }

        /* 登入畫面 */
        #login-container {
            position:fixed; top:0; left:0; width:100%; height:100%;
            display:flex; justify-content:center; align-items:center; background:rgba(0,0,0,0.6); z-index:10;
        }

        .login-box {
            background:rgba(0,0,0,0.7); padding:40px 60px; border-radius:15px; text-align:center; width:380px;
            box-shadow:0 0 30px rgba(0,255,255,0.3);
        }

        h1 { font-size:2.8rem; margin-bottom:30px; color:#00ffff; text-shadow:0 0 10px cyan; }
        .input-group { margin:20px 0; text-align:left; }
        label { display:block; margin-bottom:8px; font-size:1.1rem; }
        input { width:100%; padding:12px; border:none; border-radius:8px; font-size:1.1rem;
                background:rgba(255,255,255,0.15); color:white; }
        input:focus { outline:none; box-shadow:0 0 10px cyan; }
        button { margin:15px 10px; padding:12px 30px; font-size:1.2rem; border:none; border-radius:8px; cursor:pointer; }
        #loginBtn { background:#00d4ff; color:black; }
        #registerBtn { background:#ff00aa; color:white; }
        button:hover { transform:scale(1.05); box-shadow:0 0 15px currentColor; }
        #message { margin-top:20px; min-height:25px; color:#ffcc00; font-weight:bold; }

        /* 主頁面 */
        #main-page { display:none; height:100%; position:relative; }

        .main-container { display:flex; height:100%; position:relative; }

        /* 左側（透明，不加模糊） */
        .left-panel {
            width:25%; padding:20px 30px; display:flex; flex-direction:column; justify-content:space-between;
            background: transparent; /* 完全透明 */
        }

        .top-buttons { display:flex; gap:15px; flex-wrap:wrap; }
        .top-buttons button {
            padding:8px 16px; background:rgba(255,255,255,0.15); border:none; border-radius:6px;
            color:white; cursor:pointer; font-size:1rem;
        }
        .top-buttons button:hover { background:rgba(0,255,255,0.4); }

        .player-info { text-align:center; margin:40px 0; }
        .player-info h2 { font-size:2rem; margin-bottom:8px; text-shadow:1px 1px 3px black; }
        .player-info p { font-size:1.2rem; opacity:0.9; }

        .bottom-buttons { display:flex; flex-direction:column; gap:15px; }
        .bottom-buttons button {
            padding:14px; background:rgba(255,255,255,0.15); border:none; border-radius:8px;
            color:white; font-size:1.1rem; cursor:pointer;
        }
        .bottom-buttons button:hover { background:rgba(255,255,255,0.35); }

        /* 右側（按鈕靠右） */
        .right-panel {
            width:75%; padding:30px; display:flex; flex-direction:column; gap:25px;
            align-items:flex-end; /* 全部靠右對齊 */
        }

        .resources {
            display:flex; gap:25px; font-size:1.2rem;
        }
        .resources span {
            background:rgba(0,0,0,0.6); padding:8px 18px; border-radius:8px; white-space:nowrap;
        }

        /* 終端 - 大按鈕，靠右，解決透明部分反白 */
        .big-button {
            /* ==================== 尺寸與間距 ==================== */
            padding: 22px 60px;           /* 內部留白：上/下 35px，左/右 60px。數字越大，按鈕內文字距離邊緣越遠 */
            font-size: 2.5rem;            /* 文字大小（2.1rem ≈ 33.6px）。調大文字會變大，但可能需要調整 height */
            min-width: 420px;             /* 最小寬度。防止按鈕被壓得太窄 */
            height: 178px;                /* 固定高度。配合你的按鈕圖片設計 */
            /* ==================== 外觀樣式 ==================== */
            border: none;                 /* 移除邊框（不要框線） */
            border-radius: 35;             /* 圓角大小。0 = 完全方形（適合木牌風格） */
            color: #ffffff;               /* 文字顏色 */
            cursor: pointer;              /* 滑鼠移上去變成「手」圖示，表示可點擊 */
            /* ==================== 背景圖片設定（最重要） ==================== */
            background-color: transparent !important;   /* 背景色設為透明（讓 PNG 透明部分真正顯示） */
            background-size: contain;       /* cover是背景圖片「覆蓋」整個按鈕區域，contain是保持圖片比例*/
            background-position: center;  /* 背景圖片置中 */
            background-repeat: no-repeat; /* 不重複顯示 */
            /* ==================== 定位與層級 ==================== */
            position: relative;           /* 讓子元素（文字）可以相對定位 */
            overflow: hidden;             /* 超出部分隱藏，避免圖片溢出 */
            /* ==================== 文字字形設定 ==================== */
            font-family: "Noto Sans TC", "PingFang TC", sans-serif;
            font-weight: 700;           /* 加粗（700 = 較粗） */
            letter-spacing: 2px;        /* 字間距（讓文字更舒展） */

            /* 去掉藍色反光 */
            box-shadow: none;
            /* 或者如果你還想保留一點陰影，可以用下面這行代替 */
            /* box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); */
        }

        /* 移除暗化層（這是造成白色塊的主因） */
        .big-button::before {
            display: none;
        }

        /* 確保文字在最上層且有陰影更清晰 */
        .big-button > * {
            position: relative;
            z-index: 2;
            text-shadow: 0 0 10px #ffd700,
                         0 0 20px #ffd700,
                        -2px -2px 4px #ffd700;
        }

        /* 其他按鈕群 - 靠右，小一點 */
        .button-row {
            display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end; /* 靠右 */
            max-width:80%; /* 限制寬度 */
        }
        .button-row button {
            flex:0 1 auto; min-width:100px; padding:12px 20px;
            background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.3);
            border-radius:8px; color:white; cursor:pointer; font-size:1rem;
        }
        .button-row button:hover { background:rgba(0,255,255,0.35); }

        /* 看板角色 - 右下角，壓在按鈕「後面」 */
        #operator-center {
            position: absolute; top: 50%;
            left: 50%; transform: translate(-50%, -50%);
            max-height:85vh; max-width:40vw;
            object-fit:contain; z-index:0; pointer-events:none;
        }

        /* 預覽模式 */
        .preview-mode .left-panel,
        .preview-mode .right-panel,
        .preview-mode .overlay { display:none !important; }

        .skill-btn {
            width: 60px !important;
            height: 60px !important;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;  /* 確保圖片不溢出 */
            padding: 0;  /* 移除 padding 避免擠壓 */
        }

        .skill-btn img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
            display: block;  /* 強制顯示 */
        }
    </style>
</head>
<body>

    <img id="background" src="images/background.jpg" alt="背景">
    <div class="overlay" id="overlay"></div>

    <!-- 登入畫面 -->
    <div id="login-container">
        <div class="login-box">
            <h1>織夢</h1>
            <div class="input-group">
                <label for="username">玩家名稱（ID）</label>
                <input type="text" id="username" placeholder="例如：小明博士" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">密碼</label>
                <input type="password" id="password" placeholder="請輸入密碼">
            </div>
            <button id="loginBtn">登入</button>
            <button id="registerBtn">創建新帳號</button>
            <div id="message"></div>
        </div>
    </div>

    <!-- 主頁面 -->
    <div id="main-page">
        <!-- 看板角色（可拖曳縮放） -->
        <img id="operator-center" 
             src="images/operator/default.png" 
             alt="看板角色"
             style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                    max-height: 70vh; max-width: 45vw; object-fit: contain; z-index: 0; 
                    cursor: move; user-select: none;">
    <!-- 設定頁面（先隱藏） -->
    <div id="settings-page" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:5; color:white; display:flex; justify-content:center; align-items:center; flex-direction:column;">
        <h2>設定</h2>
        <button id="logout-btn" style="margin-top:30px; padding:15px 40px; font-size:1.4rem; background:#ff4444; border:none; border-radius:10px; color:white; cursor:pointer;">
            帳號登出
        </button>
        <button onclick="document.getElementById('settings-page').style.display='none';" style="margin-top:20px; padding:10px 20px; background:rgba(255,255,255,0.2); border:none; border-radius:8px; color:white;">
            返回主頁
        </button>
    </div>

        <div class="main-container">
            <!-- 左側 -->
            <div class="left-panel">
                <div class="top-buttons">
                    <button>設定</button>
                    <button>郵件</button>
                    <button>公告</button>
                </div>

                <div class="player-info">
                    <h2 id="player-name">博士</h2>
                    <p>等級：1</p>
                </div>

                <div class="bottom-buttons">
                    <button>好友</button>
                    <button>主頁編輯</button>
                    <button id="preview-btn">預覽</button>
                </div>
            </div>

            <!-- 右側 -->
            <div class="right-panel">
                <div class="resources">
                    <span id="lmd">龍門幣：0</span>
                    <span id="orundum">合成玉：0</span>
                    <span id="originium">至純源石：0</span>
                </div>

                <button class="big-button" id="terminal-btn">
                    <span style="display:none;">舉殤酒館</span>
                </button>

                <div class="button-row">
                    <button>編隊</button>
                    <button>幹員</button>
                </div>

                <div class="button-row">
                    <button>商城</button>
                    <button>公開招募</button>
                    <button>幹員尋訪</button>
                </div>

                <div class="button-row">
                    <button>任務</button>
                    <button>基建</button>
                    <button>倉庫</button>
                </div>
            </div>
        </div>
    <!-- 主頁編輯彈窗 -->
        <div id="homepage-edit-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:20; justify-content:center; align-items:center;">
            <div style="background:rgba(20,20,30,0.95); padding:30px; border-radius:16px; max-width:900px; width:90%; max-height:85vh; overflow-y:auto; box-shadow:0 0 40px rgba(0,255,255,0.4);">
                <h2 style="text-align:center; margin-bottom:20px; color:#00ffff;">主頁編輯 - 背景更換</h2>
                
                <div style="margin-bottom:20px; text-align:center;">
                    <strong>目前背景：</strong> <span id="current-bg-name" style="color:#ffd700;"></span>
                </div>

                <!-- 背景縮圖網格 -->
                <div id="bg-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:15px; margin-bottom:25px;">
                    <!-- JS 會動態生成 -->
                </div>

                <div style="text-align:center; margin-top:20px;">
                    <button id="save-bg-btn" style="padding:12px 40px; background:#00d4ff; color:black; border:none; border-radius:8px; font-size:1.1rem; margin-right:15px; cursor:pointer;">
                        儲存設定
                    </button>
                    <button id="cancel-bg-btn" style="padding:12px 40px; background:rgba(255,255,255,0.2); border:none; border-radius:8px; font-size:1.1rem; cursor:pointer;">
                        取消
                    </button>
                </div>
            </div>
        </div>
        <!-- 看板角色位置調整介面（全螢幕 + 顯示真實背景） -->
        <div id="operator-edit-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:30;">
            <img id="edit-background" src="" style="position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-1;">
            
            <div style="position:absolute; bottom:30px; right:30px; display:flex; flex-direction:column; gap:15px; z-index:10; align-items:flex-end;">
                <div style="color:#00ffff; font-size:1.1rem;">
                    縮放大小： <span id="scale-value">1.0</span>x
                </div>
                <input type="range" id="scale-slider" 
                    min="0.3" max="3.0" step="0.05" value="1.0"
                    style="width:280px; accent-color:#00d4ff;">
                
                <div style="display:flex; gap:15px;">
                    <button id="confirm-position-btn" style="padding:14px 36px; background:#00d4ff; color:black; font-size:1.1rem; border:none; border-radius:8px; cursor:pointer;">
                        確認位置並儲存
                    </button>
                    <button id="cancel-position-btn" style="padding:14px 36px; background:rgba(255,255,255,0.2); border:none; border-radius:8px; color:white; cursor:pointer;">
                        取消
                    </button>
                </div>
            </div>

            <img id="edit-operator" src="" style="position:absolute; cursor:move; user-select:none; z-index:5; box-shadow:0 0 30px rgba(0,255,255,0.6);">
        </div>
    </div>

    <script>
        // 取得元素
        const loginContainer = document.getElementById('login-container');
        const mainPage = document.getElementById('main-page');
        const message = document.getElementById('message');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        // 讀取或初始化所有帳號資料
        function getAccounts() {
            const data = localStorage.getItem('zhimeng_accounts');
            return data ? JSON.parse(data) : { accounts: {} };
        }
        function saveAccounts(data) {
            localStorage.setItem('zhimeng_accounts', JSON.stringify(data));
        }
        // 讀取/初始化玩家個人資料（資源等）
        function getPlayerData(id) {
            const key = 'player_data_' + id;
            const data = localStorage.getItem(key);
            let player = data ? JSON.parse(data) : null;

            // 如果沒有資料，就給新玩家預設值
            if (!player) {
                player = {
                    lmd: 10000,         // 龍門幣
                    orundum: 500,       // 合成玉
                    originium: 5,       // 至純源石
                    sanity: 100,        // 當前理智
                    maxSanity: 100,     // 最大理智
                    operatorCenter: 'default.png'  // 看板角色（之後會改成可選）
                };
                localStorage.setItem(key, JSON.stringify(player));
            }

            return player;
        }
        // 顯示訊息（綠色成功 / 紅色錯誤）
        function showMessage(text, isError = false) {
            message.style.color = isError ? '#ff4444' : '#00ff88';
            message.textContent = text;
        }
        // 登入功能
        document.getElementById('loginBtn').addEventListener('click', () => {
            const id = usernameInput.value.trim();
            const pw = passwordInput.value;

            if (!id || !pw) {
                showMessage('請輸入玩家名稱和密碼！', true);
                return;
            }

            const data = getAccounts();

            if (!data.accounts[id]) {
                // ID 不存在 → 明確提示去創建
                showMessage('該ID不存在，請點擊「創建帳號」', true);
                return;
            }

            if (data.accounts[id] === pw) {
                // 登入成功
                localStorage.setItem('current_user', id);
                showMessage('登入成功！即將進入織夢世界...', false);
                setTimeout(() => {
                    loginContainer.style.display = 'none';
                    mainPage.style.display = 'block';

                    // 讀取玩家資料
                    const playerData = getPlayerData(id);
                    playerName.textContent = id;

                    // 更新資源顯示
                    document.getElementById('lmd').textContent = `龍門幣：${playerData.lmd}`;
                    document.getElementById('orundum').textContent = `合成玉：${playerData.orundum}`;
                    document.getElementById('originium').textContent = `至純源石：${playerData.originium}`;

                    // 之後會加看板角色換圖
                    // document.getElementById('operator-center').src = 'images/operator/' + playerData.operatorCenter;
                }, 1500);
            } else {
                // 密碼錯誤
                showMessage('密碼錯誤，請重新輸入密碼', true);
            }
        });
        // 創建新帳號
        document.getElementById('registerBtn').addEventListener('click', () => {
            const id = usernameInput.value.trim();
            const pw = passwordInput.value;

            if (!id || !pw) {
                showMessage('請輸入玩家名稱和密碼！', true);
                return;
            }

            if (id.length < 3) {
                showMessage('玩家名稱至少要 3 個字！', true);
                return;
            }

            const data = getAccounts();

            if (data.accounts[id]) {
                // 已存在 → 明確提示去登入
                showMessage('該ID已存在，請點擊「登入」', true);
                return;
            }

            // 建立新帳號
            data.accounts[id] = pw;
            saveAccounts(data);

            showMessage('帳號創建成功！現在可以登入囉～', false);
            // 自動填入剛創的帳號，方便直接登入
            usernameInput.value = id;
            passwordInput.value = pw;  // 順便填密碼，方便測試
        });
        // 登出功能（主頁面用）
        function logout() {
            localStorage.removeItem('current_user');
            mainPage.style.display = 'none';
            loginContainer.style.display = 'block';
            showMessage('');
            usernameInput.value = '';
            passwordInput.value = '';
        }
        // 頁面載入時：如果已經有登入，就直接進主頁
        window.addEventListener('load', () => {
            const current = localStorage.getItem('current_user');
            if (current && getAccounts().accounts[current]) {
                loginContainer.style.display = 'none';
                mainPage.style.display = 'block';

                const playerData = getPlayerData(current);
                document.getElementById('player-name').textContent = current;
                document.getElementById('lmd').textContent = `龍門幣：${playerData.lmd}`;
                document.getElementById('orundum').textContent = `合成玉：${playerData.orundum}`;
                document.getElementById('originium').textContent = `至純源石：${playerData.originium}`;
                
                const centerData = getPlayerOperatorCenter(current);
                applyOperatorCenter(centerData);
                // 【新增】登入後立即套用背景
                const currentBgId = getCurrentBackground(current);
                applyBackground(currentBgId);
                
                // 【新增】設定終端按鈕的自訂背景圖
                const terminalBtn = document.getElementById('terminal-btn');
                if (terminalBtn) {
                    terminalBtn.style.backgroundImage = "url('images/buttons/terminal.png')";
                    console.log('✅ 終端按鈕背景圖已套用');
                }
            }
        });

        // 預覽模式（同之前）
        document.getElementById('preview-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.body.classList.add('preview-mode');
        });
        document.addEventListener('click', (e) => {
            if (document.body.classList.contains('preview-mode') && e.target.id !== 'preview-btn') {
                document.body.classList.remove('preview-mode');
            }
        });

        // 找到「主頁編輯」按鈕（bottom-buttons 中的第二個按鈕）
        const homepageEditBtn = document.querySelector('.bottom-buttons button:nth-child(2)');
        if (homepageEditBtn) {
            homepageEditBtn.addEventListener('click', () => {
                console.log('✅ 主頁編輯按鈕被點擊了！');  // 用來除錯
                openHomepageEditor();
            });
        } else {
            console.error('❌ 找不到主頁編輯按鈕！');
        }
        
        // 開啟設定頁面（點擊「設定」按鈕）
        document.querySelector('.top-buttons button:nth-child(1)').addEventListener('click', () => {
            document.getElementById('settings-page').style.display = 'flex';
        });
        // 登出按鈕
        document.getElementById('logout-btn').addEventListener('click', () => {
            if (confirm('確定要登出嗎？')) {
                localStorage.removeItem('current_user');
                document.getElementById('settings-page').style.display = 'none';
                mainPage.style.display = 'none';
                loginContainer.style.display = 'flex';
            }
        });

        // 主頁編輯按鈕
        document.querySelector('.bottom-buttons button:nth-child(2)').addEventListener('click', () => {  // 「主頁編輯」是第二個按鈕
            openHomepageEditor();
        });
        // ==================== 主頁編輯總入口 ====================
        function openHomepageEditor() {
            console.log('🚀 openHomepageEditor 函式被呼叫了！');
            
            const modal = document.getElementById('homepage-edit-modal');
            if (!modal) {
                console.error('❌ 找不到 homepage-edit-modal');
                return;
            }

            const grid = document.getElementById('bg-grid');
            const currentName = document.getElementById('current-bg-name');
            const currentUser = localStorage.getItem('current_user');
            const currentBgId = getCurrentBackground(currentUser);

            currentName.textContent = availableBackgrounds.find(b => b.id === currentBgId)?.name || "雨中街頭";

            // 清空並生成背景
            grid.innerHTML = '';
            availableBackgrounds.forEach(bg => {
                const div = document.createElement('div');
                div.style.cursor = 'pointer';
                div.style.border = (bg.id === currentBgId) ? '3px solid #00ffff' : '2px solid rgba(255,255,255,0.2)';
                div.style.borderRadius = '8px';
                div.style.overflow = 'hidden';
                div.style.padding = '8px';

                div.innerHTML = `
                    <img src="images/${bg.filename}" style="width:100%; height:120px; object-fit:cover; border-radius:6px;" alt="${bg.name}">
                    <div style="text-align:center; margin-top:8px; font-size:0.95rem;">${bg.name}</div>
                `;

                div.addEventListener('click', () => {
                    document.querySelectorAll('#bg-grid > div').forEach(d => d.style.border = '2px solid rgba(255,255,255,0.2)');
                    div.style.border = '3px solid #00ffff';
                    window.selectedBgId = bg.id;
                });

                grid.appendChild(div);
            });

            // 移除舊角色區
            const oldRole = modal.querySelector('.role-section');
            if (oldRole) oldRole.remove();

            // 新增角色選擇
            const roleSection = document.createElement('div');
            roleSection.className = 'role-section';
            roleSection.style.marginTop = '35px';
            roleSection.innerHTML = `<h3 style="color:#00ffff; margin-bottom:15px;">選擇看板角色</h3>`;

            const roleGrid = document.createElement('div');
            roleGrid.style.display = 'grid';
            roleGrid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(110px, 1fr))';
            roleGrid.style.gap = '12px';

            const currentCenter = getPlayerOperatorCenter(currentUser);

            operators.forEach(op => {
                const roleDiv = document.createElement('div');
                roleDiv.style.textAlign = 'center';
                roleDiv.style.cursor = 'pointer';
                roleDiv.style.padding = '8px';
                roleDiv.style.border = (currentCenter.operatorId === op.serial_number) ? '3px solid #00ffff' : '2px solid rgba(255,255,255,0.2)';
                roleDiv.style.borderRadius = '8px';
                roleDiv.dataset.id = op.serial_number;

                roleDiv.innerHTML = `
                    <img src="${op.portrait}" style="width:100%; height:100px; object-fit:contain;">
                    <div style="margin-top:6px;">${op.name}</div>
                `;

                roleDiv.addEventListener('click', () => {
                    modal.style.display = 'none';
                    openOperatorPositionEditor(op.serial_number);
                });

                roleGrid.appendChild(roleDiv);
            });

            roleSection.appendChild(roleGrid);
            modal.querySelector('div').appendChild(roleSection);

            modal.style.display = 'flex';

            // 按鈕事件
            document.getElementById('save-bg-btn').onclick = () => {
                if (window.selectedBgId) setCurrentBackground(currentUser, window.selectedBgId);
                modal.style.display = 'none';
            };

            document.getElementById('cancel-bg-btn').onclick = () => {
                modal.style.display = 'none';
            };
        }
    </script>
</body>
</html>
